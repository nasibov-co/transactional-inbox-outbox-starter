name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Generate aggregate code coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ./gradlew testCodeCoverageReport

      - name: Upload aggregate code coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-aggregate-report
          path: build/reports/jacoco/testCodeCoverageReport
          if-no-files-found: error
